[package]
name = "papel-shell-tauri"
version = "0.1.0"
description = "Papel portable shell: the static web bundle in WebView2"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Native folder/save dialogs. Same crate the native shell scaffold uses.
rfd = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
